version: '3.8'

services:
  pandora-backend:
    build: .
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: production
      PORT: 3001
      CORS_ORIGIN: "http://localhost:5173,http://localhost:3000"
      JWT_SECRET: "change-this-in-production-very-secret-key"
    volumes:
      - ./backend/pandora.db:/app/pandora.db
    restart: unless-stopped
