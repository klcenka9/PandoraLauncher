name: Build and Release Pandora Launcher

on:
  push:
    branches:
      - claude/clear-all-content-epbayo
      - main
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install

      - name: Install backend dependencies
        run: |
          cd backend
          npm install
          cd ..

      - name: Build Windows executable
        run: npx electron-builder --win --publish never

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Build Linux AppImage
        run: npx electron-builder --linux

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-builds
          path: dist/*.AppImage

  release:
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows builds
        uses: actions/download-artifact@v4
        with:
          name: windows-builds
          path: ./artifacts/windows

      - name: Download Linux builds
        uses: actions/download-artifact@v4
        with:
          name: linux-builds
          path: ./artifacts/linux

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/windows/*.exe
            artifacts/linux/*.AppImage
          body: |
            # Pandora Launcher Release

            ## 📦 Downloads
            - **Windows**: `Pandora Launcher-0.1.0.exe`
            - **Linux**: `Pandora Launcher-0.1.0.AppImage`

            ## 🚀 Deployment
            See [DEPLOYMENT.md](https://github.com/klcenka9/PandoraLauncher/blob/main/DEPLOYMENT.md) for backend deployment instructions.

            ### Quick Start Backend
            ```bash
            docker-compose up -d
            ```

            Or deploy to Railway.app for free: https://railway.app
          draft: false
