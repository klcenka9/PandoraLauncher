services:
  - type: web
    name: pandora-launcher-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: CORS_ORIGIN
        scope: RUN_TIME
      - key: JWT_SECRET
        scope: RUN_TIME
    disk:
      name: db
      mountPath: /app/backend
      sizeGB: 1
    healthCheckPath: /api/health
