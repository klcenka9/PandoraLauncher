appId: com.pandoralauncher.app
productName: Pandora Launcher
directories:
  buildResources: assets
  output: release
publish:
  provider: github
  owner: klcenka9
  repo: PandoraLauncher

linux:
  target:
    - AppImage

files:
  - from: .
    to: .
    filter:
      - package.json
      - node_modules
      - src/main
      - dist
      - index.html

win:
  certificateFile: null
  certificatePassword: null
  signingHashAlgorithms:
    - sha256
  sign: null
  target:
    - portable
    - nsis

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Pandora Launcher
